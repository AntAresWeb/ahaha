[project]
name = "ahaha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "gigachat>=0.2.1",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
]

[tool.pytest]
pythonpath=["."]
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_tests.py",
    "tests_*.py",
]
addopts = [
    "--import-mode=importlib",
    "-p", "no:warnings",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
