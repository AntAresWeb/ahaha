[project]
name = "ahaha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
tests = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest]
pythonpath=["."]
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_tests.py",
    "tests_*.py",
]
addopts = [
    "--import-mode=importlib",
    "-p", "no:warnings",
]
